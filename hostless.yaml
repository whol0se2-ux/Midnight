build:
  system: docker

dockerfile_path: ./Dockerfile

scaling:
  trigger: http_requests
  min_cpu: 0.5
  max_cpu: 0.5
  min_memory: 1024
  max_memory: 1024
  min_replicas: 1
  max_replicas: 1
  max_http_requests_per_replica: 16

health_check:
  type: http
  http_path: /health
  interval_in_seconds: 30
